services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mantis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 10

  migrate:
    build: .
    entrypoint: ["goose", "-dir", "/app/migrations", "postgres", "postgres://postgres:postgres@postgres:5432/mantis?sslmode=disable", "up"]
    working_dir: /app
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy

  sandbox-prebuild:
    build: .
    entrypoint: ["go", "run", "./cmd/sandbox-prebuild"]
    working_dir: /app
    environment:
      DOCKER_SOCKET: /var/run/docker.sock
      RUNTIME_NETWORK: "${RUNTIME_NETWORK:-sandbox-net}"
      GOFLAGS: "-buildvcs=false"
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - /var/run/docker.sock:/var/run/docker.sock
    restart: "no"

  app:
    build: .
    ports:
      - "${MANTIS_BACKEND_PORT:-27480}:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/mantis?sslmode=disable
      PORT: "8080"
      ATTACHMENT_DIR: /data/attachments
      AUTH_TOKEN: "${AUTH_TOKEN:-}"
      AUTH_USER_NAME: "${AUTH_USER_NAME:-admin}"
      AUTH_RATE_LIMIT_MAX: "${AUTH_RATE_LIMIT_MAX:-}"
      AUTH_RATE_LIMIT_WINDOW: "${AUTH_RATE_LIMIT_WINDOW:-}"
      MANTIS_LLM_BASE_URL: "${MANTIS_LLM_BASE_URL:-}"
      MANTIS_LLM_API_KEY: "${MANTIS_LLM_API_KEY:-}"
      MANTIS_LLM_MODEL: "${MANTIS_LLM_MODEL:-}"
      MANTIS_TG_BOT_TOKEN: "${MANTIS_TG_BOT_TOKEN:-}"
      MANTIS_TG_USER_IDS: "${MANTIS_TG_USER_IDS:-}"
      ASR_API_URL: "${ASR_API_URL:-}"
      OCR_API_URL: "${OCR_API_URL:-}"
      TTS_API_URL: "${TTS_API_URL:-}"
      MANTIS_SUPERVISOR_MAX_ITERATIONS: "${MANTIS_SUPERVISOR_MAX_ITERATIONS:-}"
      MANTIS_SUPERVISOR_TIMEOUT: "${MANTIS_SUPERVISOR_TIMEOUT:-15m}"
      MANTIS_SERVER_MAX_ITERATIONS: "${MANTIS_SERVER_MAX_ITERATIONS:-}"
      MANTIS_SERVER_TIMEOUT: "${MANTIS_SERVER_TIMEOUT:-15m}"
      MANTIS_PLAN_STEP_TIMEOUT: "${MANTIS_PLAN_STEP_TIMEOUT:-15m}"
      RUNTIME_MODE: "${RUNTIME_MODE:-docker}"
      RUNTIME_NETWORK: "${RUNTIME_NETWORK:-sandbox-net}"
      RUNTIME_API_TOKEN: "${RUNTIME_API_TOKEN:-}"
      DOCKER_SOCKET: /var/run/docker.sock
      EGRESS_GATEWAY_URL: "${EGRESS_GATEWAY_URL:-http://egress-gateway:9999}"
      EGRESS_GATEWAY_CONTAINER: "${EGRESS_GATEWAY_CONTAINER:-mantis-egress-gateway}"
      GOFLAGS: "-buildvcs=false"
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - attachments:/data/attachments
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - sandbox
    working_dir: /app
    depends_on:
      migrate:
        condition: service_completed_successfully
      sandbox-prebuild:
        condition: service_completed_successfully
      egress-gateway:
        condition: service_started

  egress-gateway:
    build: .
    container_name: mantis-egress-gateway
    entrypoint: ["go", "run", "./cmd/egress-gateway"]
    working_dir: /app
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      RUNTIME_STATE_URL: "http://app:8080/api/runtime/egress/state"
      RUNTIME_API_TOKEN: "${RUNTIME_API_TOKEN:-}"
      GUARD_INGEST_URL: "${GUARD_INGEST_URL:-http://app:8080}"
      GUARD_INGEST_TOKEN: "${GUARD_INGEST_TOKEN:-}"
      DNS_LISTEN: "${EGRESS_DNS_LISTEN:-:53}"
      HTTP_LISTEN: ":9999"
      POLL_INTERVAL: "${EGRESS_POLL_INTERVAL:-30s}"
      EGRESS_DRY_RUN: "${EGRESS_DRY_RUN:-true}"
      GOFLAGS: "-buildvcs=false"
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    networks:
      - default
      - sandbox

  frontend:
    build: frontend
    ports:
      - "${MANTIS_FRONTEND_PORT:-27173}:5173"
    environment:
      API_URL: http://app:8080
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./.env:/.env:ro
    depends_on:
      - app

volumes:
  pgdata:
  attachments:
  go-mod-cache:
  go-build-cache:

networks:
  default:
  sandbox:
    name: sandbox-net
