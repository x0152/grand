global:
  nameOverride: ""
  fullnameOverride: ""
  timezone: "UTC"
  secretName: ""
  configName: ""
  imagePullSecrets: []

config:
  app:
    port: "8080"
    attachmentDir: "/data/attachments"
  postgres:
    host: ""
    port: ""
    sslmode: "disable"
  auth:
    userName: "admin"
    rateLimitMax: "5"
    rateLimitWindow: "15m"
  llm:
    baseUrl: ""
    model: ""
  telegram:
    userIds: ""
  asr:
    apiUrl: ""
  ocr:
    apiUrl: ""
  tts:
    apiUrl: ""
  gonka:
    defaultNodeUrl: "http://node1.gonka.ai:8000"
    nodeUrl: ""

apps:
  global:
    image:
      repository: mantis
      tag: latest
      pullPolicy: IfNotPresent
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    resources:
      requests:
        memory: 256Mi
        cpu: 200m
      limits:
        memory: 1Gi
        cpu: 1000m
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
    nodeSelector: {}
    tolerations: []
    affinity: {}

  main:
    replicaCount: 1
    port: 8080
    serviceName: app
    apps: "auth,chat,metadata,plans,logs,config,gonka,runtime"
    attachments: true
    dind: true
    ingressPaths:
      - /api
    deploymentStrategy:
      type: Recreate
    resources:
      requests:
        memory: 256Mi
        cpu: 200m
      limits:
        memory: 1Gi
        cpu: 1000m

  auth:
    replicaCount: 1
    port: 8080
    apps: "auth"
    ingressPaths:
      - /api/auth
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 200m

  metadata:
    replicaCount: 1
    port: 8080
    apps: "metadata,plans"
    ingressPaths:
      - /api/metadata
      - /api/plans
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

  chat:
    replicaCount: 1
    port: 8080
    apps: "chat"
    attachments: true
    ingressPaths:
      - /api/chat
      - /api/artifacts
    resources:
      requests:
        memory: 256Mi
        cpu: 200m
      limits:
        memory: 1Gi
        cpu: 1000m

  logs:
    replicaCount: 1
    port: 8080
    apps: "logs"
    ingressPaths:
      - /api/logs

  telegram:
    replicaCount: 1
    port: 8080
    apps: "telegram"
    ingressPaths:
      - /api/telegram

  gonka:
    replicaCount: 1
    port: 8080
    apps: "gonka"
    ingressPaths:
      - /api/gonka

  config:
    replicaCount: 1
    port: 8080
    apps: "config"
    ingressPaths:
      - /api/config

  runtime:
    replicaCount: 1
    port: 8080
    apps: "runtime"
    dind: true
    ingressPaths:
      - /api/runtime
    deploymentStrategy:
      type: Recreate
    resources:
      requests:
        memory: 256Mi
        cpu: 200m
      limits:
        memory: 1Gi
        cpu: 1000m

frontend:
  enabled: true
  replicaCount: 1
  port: 80
  image:
    repository: mantis-frontend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m

postgres:
  enabled: true
  image: postgres:17-alpine
  port: 5432
  storage: 20Gi
  storageClassName: ""
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 1000m

migration:
  enabled: true
  backoffLimit: 3
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

ingress:
  enabled: true
  host: mantis.example.com
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10g"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  certManagerIssuer: ""
  tls: []

secrets:
  postgres:
    user: postgres
    password: postgres
    db: mantis
  authToken: "mantis-dev-token"
  llmApiKey: ""
  tgBotToken: ""
  gonkaPrivateKey: ""

attachments:
  storage: 20Gi
  storageClassName: ""

runtime:
  dockerSocket: /var/run/docker.sock
  network: sandbox-net
  sandboxCaps: "NET_RAW,NET_ADMIN"
  apiToken: ""
  dind:
    image: docker:24-dind
    storage:
      enabled: true
      size: 30Gi
      storageClassName: ""
    resources:
      requests:
        memory: 512Mi
        cpu: 200m
      limits:
        memory: 4Gi
        cpu: 2000m
