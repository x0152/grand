{{- range $appName, $appCfg := .Values.apps }}
{{- if ne $appName "global" }}
{{- $svcName := include "mantis.appServiceName" (dict "ctx" $ "app" $appName "cfg" $appCfg) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "mantis.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $appName }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $appCfg.port | default 8080 }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "mantis.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $appName }}
{{- end }}
{{- end }}
