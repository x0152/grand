{{- $fullName := include "mantis.fullname" . -}}
{{- $needsAttachments := false -}}
{{- range $appName, $appCfg := .Values.apps -}}
{{- if and (ne $appName "global") (default false $appCfg.attachments) -}}
{{- $needsAttachments = true -}}
{{- end -}}
{{- end -}}
{{- if $needsAttachments }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullName }}-attachments
  labels:
    {{- include "mantis.labels" . | nindent 4 }}
    app.kubernetes.io/component: attachments
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.attachments.storage }}
  {{- with .Values.attachments.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
