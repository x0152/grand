{{- if .Values.ingress.enabled }}
{{- $fullName := include "mantis.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "mantis.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations .Values.ingress.certManagerIssuer }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.ingress.certManagerIssuer }}
    cert-manager.io/cluster-issuer: {{ . | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.ingressClassName }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range $appName, $appCfg := .Values.apps }}
          {{- if and (ne $appName "global") $appCfg.ingressPaths }}
          {{- $svcName := include "mantis.appServiceName" (dict "ctx" $ "app" $appName "cfg" $appCfg) }}
          {{- range $path := $appCfg.ingressPaths }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $svcName }}
                port:
                  number: {{ $appCfg.port | default 8080 }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if .Values.frontend.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.frontend.port }}
          {{- end }}
{{- end }}
