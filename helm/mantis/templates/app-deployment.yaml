{{- $fullName := include "mantis.fullname" . -}}
{{- $global := .Values.apps.global -}}
{{- range $appName, $appCfg := .Values.apps }}
{{- if ne $appName "global" }}
{{- $name := include "mantis.appName" (dict "ctx" $ "app" $appName) }}
{{- $strategy := default $global.deploymentStrategy $appCfg.deploymentStrategy }}
{{- $resources := default $global.resources $appCfg.resources }}
{{- $autoscaling := default $global.autoscaling $appCfg.autoscaling }}
{{- $hpaEnabled := default false $autoscaling.enabled }}
{{- $needsAttachments := default false $appCfg.attachments }}
{{- $needsDind := default false $appCfg.dind }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "mantis.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $appName }}
spec:
  {{- if not $hpaEnabled }}
  replicas: {{ $appCfg.replicaCount | default 1 }}
  {{- end }}
  strategy:
    type: {{ $strategy.type }}
    {{- if eq $strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ $strategy.rollingUpdate.maxUnavailable | default 0 }}
      maxSurge: {{ $strategy.rollingUpdate.maxSurge | default 1 }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "mantis.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $appName }}
  template:
    metadata:
      labels:
        {{- include "mantis.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $appName }}
    spec:
      {{- include "mantis.imagePullSecrets" $ | nindent 6 }}
      {{- if $needsDind }}
      securityContext:
        runAsUser: 0
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: {{ $.Values.postgres.image | quote }}
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER"; do
                echo "waiting for postgres..."
                sleep 2
              done
              export PGPASSWORD="$POSTGRES_PASSWORD"
              until [ "$(psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT to_regclass('public.goose_db_version') IS NOT NULL" 2>/dev/null)" = "t" ]; do
                echo "waiting for migrations..."
                sleep 3
              done
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "mantis.configName" $ }}
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "mantis.configName" $ }}
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "mantis.secretName" $ }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mantis.secretName" $ }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "mantis.secretName" $ }}
                  key: POSTGRES_DB
      containers:
        - name: app
          image: "{{ $global.image.repository }}:{{ $global.image.tag }}"
          imagePullPolicy: {{ $global.image.pullPolicy }}
          {{- if $needsDind }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              for i in $(seq 1 120); do
                if [ -S "{{ $.Values.runtime.dockerSocket }}" ] && nc -z 127.0.0.1 2375 >/dev/null 2>&1; then
                  exec /usr/local/bin/mantis
                fi
                sleep 1
              done
              echo "docker API did not become ready in time" >&2
              exit 1
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $appCfg.port | default 8080 }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          env:
            {{- include "mantis.commonEnv" $ | nindent 12 }}
            - name: MANTIS_APPS
              value: {{ $appCfg.apps | default "" | quote }}
            {{- if $needsDind }}
            - name: RUNTIME_MODE
              value: docker
            - name: DOCKER_SOCKET
              value: {{ $.Values.runtime.dockerSocket | quote }}
            - name: RUNTIME_NETWORK
              value: {{ $.Values.runtime.network | default "sandbox-net" | quote }}
            - name: RUNTIME_SANDBOX_CAPS
              value: {{ $.Values.runtime.sandboxCaps | default "NET_RAW,NET_ADMIN" | quote }}
            {{- with $.Values.runtime.apiToken }}
            - name: RUNTIME_API_TOKEN
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with $appCfg.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or $needsAttachments $needsDind }}
          volumeMounts:
            {{- if $needsAttachments }}
            - name: attachments
              mountPath: /data/attachments
            {{- end }}
            {{- if $needsDind }}
            - name: docker-socket
              mountPath: /var/run
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml $resources | nindent 12 }}
        {{- if $needsDind }}
        - name: dind
          image: {{ $.Values.runtime.dind.image | quote }}
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          args:
            - --host=unix:///var/run/docker.sock
            - --tls=false
            - --storage-driver=overlay2
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run
            - name: dind-storage
              mountPath: /var/lib/docker
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -S /var/run/docker.sock && docker info >/dev/null 2>&1"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          resources:
            {{- toYaml $.Values.runtime.dind.resources | nindent 12 }}
        {{- end }}
      {{- if or $needsAttachments $needsDind }}
      volumes:
        {{- if $needsAttachments }}
        - name: attachments
          persistentVolumeClaim:
            claimName: {{ $fullName }}-attachments
        {{- end }}
        {{- if $needsDind }}
        - name: docker-socket
          emptyDir: {}
        - name: dind-storage
          {{- if $.Values.runtime.dind.storage.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}-dind-storage
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- with $global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
