services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-mantis}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: "no"
    entrypoint: ["/usr/local/bin/goose", "-dir", "/migrations", "postgres", "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mantis}?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  sandbox-prebuild:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: "no"
    entrypoint: ["/usr/local/bin/sandbox-prebuild"]
    environment:
      SANDBOX_PREBUILD_MODE: "${SANDBOX_PREBUILD_MODE:-verify}"
      DOCKER_SOCKET: /var/run/docker.sock
      RUNTIME_NETWORK: "${RUNTIME_NETWORK:-sandbox-net}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mantis}?sslmode=disable"
      PORT: "8080"
      ATTACHMENT_DIR: /data/attachments
      AUTH_TOKEN: "${AUTH_TOKEN:-}"
      AUTH_USER_NAME: "${AUTH_USER_NAME:-admin}"
      AUTH_RATE_LIMIT_MAX: "${AUTH_RATE_LIMIT_MAX:-}"
      AUTH_RATE_LIMIT_WINDOW: "${AUTH_RATE_LIMIT_WINDOW:-}"
      MANTIS_LLM_BASE_URL: "${MANTIS_LLM_BASE_URL:-}"
      MANTIS_LLM_API_KEY: "${MANTIS_LLM_API_KEY:-}"
      MANTIS_LLM_MODEL: "${MANTIS_LLM_MODEL:-}"
      MANTIS_TG_BOT_TOKEN: "${MANTIS_TG_BOT_TOKEN:-}"
      MANTIS_TG_USER_IDS: "${MANTIS_TG_USER_IDS:-}"
      MANTIS_EMAIL_ADDRESS: "${MANTIS_EMAIL_ADDRESS:-}"
      MANTIS_EMAIL_SMTP_HOST: "${MANTIS_EMAIL_SMTP_HOST:-}"
      MANTIS_EMAIL_SMTP_PORT: "${MANTIS_EMAIL_SMTP_PORT:-}"
      MANTIS_EMAIL_SMTP_USER: "${MANTIS_EMAIL_SMTP_USER:-}"
      MANTIS_EMAIL_SMTP_PASS: "${MANTIS_EMAIL_SMTP_PASS:-}"
      MANTIS_EMAIL_IMAP_HOST: "${MANTIS_EMAIL_IMAP_HOST:-}"
      MANTIS_EMAIL_IMAP_PORT: "${MANTIS_EMAIL_IMAP_PORT:-}"
      MANTIS_EMAIL_IMAP_USER: "${MANTIS_EMAIL_IMAP_USER:-}"
      MANTIS_EMAIL_IMAP_PASS: "${MANTIS_EMAIL_IMAP_PASS:-}"
      ASR_API_URL: "${ASR_API_URL:-}"
      OCR_API_URL: "${OCR_API_URL:-}"
      TTS_API_URL: "${TTS_API_URL:-}"
      MANTIS_SUPERVISOR_MAX_ITERATIONS: "${MANTIS_SUPERVISOR_MAX_ITERATIONS:-}"
      MANTIS_SUPERVISOR_TIMEOUT: "${MANTIS_SUPERVISOR_TIMEOUT:-15m}"
      MANTIS_SERVER_MAX_ITERATIONS: "${MANTIS_SERVER_MAX_ITERATIONS:-}"
      MANTIS_SERVER_TIMEOUT: "${MANTIS_SERVER_TIMEOUT:-15m}"
      MANTIS_PLAN_STEP_TIMEOUT: "${MANTIS_PLAN_STEP_TIMEOUT:-15m}"
      RUNTIME_MODE: "${RUNTIME_MODE:-docker}"
      RUNTIME_NETWORK: "${RUNTIME_NETWORK:-sandbox-net}"
      RUNTIME_API_TOKEN: "${RUNTIME_API_TOKEN:-}"
      DOCKER_SOCKET: /var/run/docker.sock
      EGRESS_GATEWAY_URL: "${EGRESS_GATEWAY_URL:-http://egress-gateway:9999}"
      EGRESS_GATEWAY_CONTAINER: "${EGRESS_GATEWAY_CONTAINER:-mantis-egress-gateway}"
    volumes:
      - attachments:/data/attachments
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - sandbox
    depends_on:
      migrate:
        condition: service_completed_successfully
      sandbox-prebuild:
        condition: service_completed_successfully
      egress-gateway:
        condition: service_started

  egress-gateway:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: mantis-egress-gateway
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/egress-gateway"]
    user: "0:0"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      RUNTIME_STATE_URL: "http://app:8080/api/runtime/egress/state"
      RUNTIME_API_TOKEN: "${RUNTIME_API_TOKEN:-}"
      DNS_LISTEN: "${EGRESS_DNS_LISTEN:-:53}"
      HTTP_LISTEN: ":9999"
      POLL_INTERVAL: "${EGRESS_POLL_INTERVAL:-30s}"
      EGRESS_DRY_RUN: "${EGRESS_DRY_RUN:-false}"
    networks:
      - default
      - sandbox

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${MANTIS_PORT:-8080}:80"
    depends_on:
      - app

volumes:
  pgdata:
  attachments:

networks:
  default:
  sandbox:
    name: sandbox-net
